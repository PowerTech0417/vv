name: Android CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK Licenses
        run: yes | sdkmanager --licenses

      - name: Install SDK Packages
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Build Leanback Release
        run: |
          ./gradlew \
          :app:assembleLeanbackRelease \
          --stacktrace

      - name: Build Mobile Release
        run: |
          ./gradlew \
          :app:assembleMobileRelease \
          --stacktrace

      - name: Upload Leanback APK
        uses: actions/upload-artifact@v4
        with:
          name: Leanback-Release
          path: app/build/outputs/apk/leanback/release/*.apk

      - name: Upload Mobile APK
        uses: actions/upload-artifact@v4
        with:
          name: Mobile-Release
          path: app/build/outputs/apk/mobile/release/*.apk
